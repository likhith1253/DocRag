[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "docrag"
version = "0.2.0"
description = "A reproducible document-grounded question answering system for research papers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=0.28,<2",
  "fastapi>=0.110,<1",
  "langgraph>=0.2,<2",
  "nltk>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2,<3",
  "pyarrow>=15,<27",
  "PyMuPDF>=1.23,<2",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "qdrant-client>=1.8,<2",
  "rank-bm25>=0.2,<1",
  "requests>=2.31,<3",
  "sentence-transformers>=2.5,<6",
  "streamlit>=1.32,<2",
  "torch>=2.2,<3",
  "transformers>=4.40,<5",
  "uvicorn[standard]>=0.28,<1",
]

[dependency-groups]
dev = [
  "matplotlib>=3.8,<4",
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[tool.setuptools]
py-modules = ["settings"]

[tool.setuptools.packages.find]
include = ["agents*", "api*", "eval*", "ingestion*", "llm*", "retrieval*", "storage*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: storage/model integration or long-running tests",
  "gpu: requires an available CUDA GPU",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["settings.py", "llm/cache.py", "retrieval/query_analyzer.py", "retrieval/paper_matcher.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
