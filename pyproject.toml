[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scratch", "demo_dataset", "qdrant_storage", "papers"]

[tool.ruff.lint]
# Correctness-focused gate (syntax errors, undefined names, redefinitions).
# Style rules are intentionally not enforced on the legacy evaluation scripts.
select = ["E9", "F63", "F7", "F82", "F811"]

[tool.ruff.lint.per-file-ignores]
# Known leftovers in one-off evaluation scripts; see docs/KNOWN_LIMITATIONS.md.
"eval/production_validation.py" = ["F821"]
"eval/redesigned_evaluator.py" = ["F821", "F811"]
"eval/comprehensive_evaluator.py" = ["F811"]
"experiments/**" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/codegraphrag/tests"]
addopts = "-ra -m 'not models and not gpu and not slow and not integration and not stale'"
timeout = 60
markers = [
    "models: needs downloaded ML models (embedder / cross-encoder / LLM) or network",
    "gpu: needs a CUDA GPU",
    "slow: long-running performance/benchmark test",
    "stale: expectations out of date with current behaviour (pre-existing failure, needs triage)",
    "integration: needs an indexed corpus or a running service",
]
